# Інші переклади на https://github.com/activerecord-hackery/ransack/blob/main/lib/ransack/locale
#
uk:
  ransack:
    search: пошук
    predicate: предикат
    and: і
    or: або
    any: будь-який
    all: усі
    combinator: комбінатор
    attribute: атрибут
    value: значення
    condition: умова
    sort: сортування
    asc: за зростанням
    desc: за спаданням
    predicates:
      eq: рівний
      eq_any: рівний будь-якому
      eq_all: рівний усім
      not_eq: не рівний
      not_eq_any: не рівний будь-якому
      not_eq_all: не рівний усім
      matches: збігається
      matches_any: збігається з будь-яким
      matches_all: збігається з усіма
      does_not_match: не збігається
      does_not_match_any: не збігається з будь-яким
      does_not_match_all: не збігається з усіма
      lt: менше ніж
      lt_any: менше за будь-який
      lt_all: менше за всі
      lteq: менше або рівне
      lteq_any: менше або рівне будь-якому
      lteq_all: менше або рівне всім
      gt: більше ніж
      gt_any: більше ніж будь-який
      gt_all: більше ніж усі
      gteq: більше або рівне
      gteq_any: більше або рівне будь-якому
      gteq_all: більше або рівне всім
      in: міститься у
      in_any: міститься в будь-якому
      in_all: міститься в усіх
      not_in: не міститься у
      not_in_any: не міститься в будь-якому
      not_in_all: не міститься в усіх
      cont: містить
      cont_any: містить будь-який
      cont_all: містить усі
      not_cont: не містить
      not_cont_any: не містить жодного
      not_cont_all: не містить усіх
      i_cont: містить, без урахування регістру
      i_cont_any: містить будь-який, без урахування регістру
      i_cont_all: містить усі, без урахування регістру
      not_i_cont: не містить, без урахування регістру
      not_i_cont_any: не містить жодного, без урахування регістру
      not_i_cont_all: не містить усіх, без урахування регістру
      start: починається з
      start_any: починається з будь-якого
      start_all: починається з усіх
      not_start: не починається з
      not_start_any: не починається з будь-якого
      not_start_all: не починається з усіх
      i_start: починається з, без урахування регістру
      i_start_any: починається з будь-якого, без урахування регістру
      i_start_all: починається з усіх, без урахування регістру
      not_i_start: не починається з, без урахування регістру
      not_i_start_any: не починається з будь-якого, без урахування регістру
      not_i_start_all: не починається з усіх, без урахування регістру
      end: закінчується на
      end_any: закінчується на будь-який
      end_all: закінчується на всі
      not_end: не закінчується на
      not_end_any: не закінчується на будь-який
      not_end_all: не закінчується на всі
      i_end: закінчується на, без урахування регістру
      i_end_any: закінчується на будь-який, без урахування регістру
      i_end_all: закінчується на всі, без урахування регістру
      not_i_end: не закінчується на, без урахування регістру
      not_i_end_any: не закінчується на будь-який, без урахування регістру
      not_i_end_all: не закінчується на всі, без урахування регістру
      'true': так
      not_true: не істина
      'false': ні
      not_false: не хиба
      present: присутній
      blank: порожній
      'null': нульовий
      not_null: не нульовий
      length_eq: довжина рівна
      length_eq_any: довжина рівна будь-якому
      length_eq_all: довжина рівна усім
      length_lt: довжина менше ніж
      length_lt_any: довжина менше за будь-який
      length_lt_all: довжина менше за всі
      length_lteq: довжина менше або рівна
      length_lteq_any: довжина менше або рівна будь-якому
      length_lteq_all: довжина менше або рівна всім
      length_gt: довжина більше ніж
      length_gt_any: довжина більше ніж будь-який
      length_gt_all: довжина більше ніж усі
      length_gteq: довжина більше або рівна
      length_gteq_any: довжина більше або рівна будь-якому
      length_gteq_all: довжина більше або рівна всім
