name: Release to RubyGems

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v5.0.0"
        required: true

permissions:
  contents: read

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest
    environment: rubygems

    permissions:
      contents: read
      # Required for the OIDC token exchange with RubyGems.org.
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Qualify the dispatch input as a tag ref. actions/checkout resolves
          # a bare name as a branch first, so a branch sharing the tag's name
          # would be published instead of the release commit.
          ref: >-
            ${{ github.event.inputs.tag
                && format('refs/tags/{0}', github.event.inputs.tag)
                || github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "3.4"

      # Guards against publishing a gem whose version contradicts its tag.
      # RubyGems releases cannot be recalled, so this has to fail before the push.
      - name: Check the tag matches lib/ransack/version.rb
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(ruby -r./lib/ransack/version -e 'print Ransack::VERSION')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Ransack::VERSION ($version). Refusing to publish."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          echo "Publishing ransack $version from tag $TAG"

      - name: Build the gem
        run: gem build ransack.gemspec

      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push to RubyGems.org
        run: gem push "ransack-${version}.gem"
