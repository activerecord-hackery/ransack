# Ransack documentation, built with Jekyll and the VitePress theme for Jekyll
# (https://jekyll-vitepress.dev) and published to GitHub Pages by
# .github/workflows/deploy.yml.
title: Ransack
description: Object-based searching for Active Record
url: https://activerecord-hackery.github.io
baseurl: /ransack
lang: en

theme: jekyll-vitepress-theme

permalink: pretty

# One collection per sidebar section; the theme builds the sidebar, the
# pager and the search index from collections. Pages are ordered by
# nav_order. The URLs are the ones the site had under Just the Docs; pages
# that moved carry their old URL in redirect_from.
collections:
  getting_started:
    permalink: /getting-started/:path/
    output: true
  going_further:
    permalink: /going-further/:path/
    output: true
  project:
    permalink: /project/:path/
    output: true

jekyll_vitepress:
  branding:
    site_title: Ransack
    logo:
      default: /assets/logo/activerecord-hackery.png
      alt: ActiveRecord Hackery
      width: 24
      height: 24
  syntax:
    light_theme: github
    dark_theme: github.dark
  # The ActiveRecord Hackery logo's reds: the Rails crimson rgb(176, 40, 58),
  # its dark maroon rgb(136, 8, 40) and the axe head's rgb(232, 48, 48).
  # Brand buttons are white text on --vp-c-brand-3, so it stays dark enough
  # for contrast in both themes.
  tokens:
    light:
      --vp-c-brand-1: "#b0283a"
      --vp-c-brand-2: "#c43344"
      --vp-c-brand-3: "#880828"
      --vp-c-brand-soft: "rgba(176, 40, 58, 0.14)"
      --vp-home-hero-name-color: "transparent"
      --vp-home-hero-name-background: "linear-gradient(120deg, #b0283a 30%, #e83030)"
      --vp-home-hero-image-background-image: "linear-gradient(-45deg, #e83030 50%, #b0283a 50%)"
      --vp-home-hero-image-filter: "blur(56px)"
    dark:
      --vp-c-brand-1: "#f06470"
      --vp-c-brand-2: "#f4858f"
      --vp-c-brand-3: "#c83442"
      --vp-c-brand-soft: "rgba(240, 100, 112, 0.16)"
      --vp-home-hero-name-background: "linear-gradient(120deg, #f06470 30%, #ffb3b8)"
      # brand-1 and brand-2 are light enough for links on a dark page, too light
      # behind a button's white text, which they are by default on hover and press.
      --vp-button-brand-hover-bg: "#a82838"
      --vp-button-brand-active-bg: "#880828"
  github_star:
    repository: activerecord-hackery/ransack
  seo:
    publisher:
      type: Organization
      name: Ransack
      url: https://github.com/activerecord-hackery/ransack
  edit_link:
    pattern: https://github.com/activerecord-hackery/ransack/edit/main/docs/:path
    text: Edit this page on GitHub
  # CI checkouts reset file times, so "Last updated" would show the build date.
  last_updated:
    enabled: false
  footer:
    message: 'Ransack is <a href="https://github.com/activerecord-hackery/ransack/blob/main/LICENSE">MIT licensed</a>. Questions belong in <a href="https://github.com/activerecord-hackery/ransack/discussions">Discussions</a>; reproducible bugs in <a href="https://github.com/activerecord-hackery/ransack/issues">Issues</a>.'

plugins:
  - jekyll-vitepress-theme
  - jekyll-relative-links
  - jekyll-redirect-from

relative_links:
  enabled: true
  collections: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

# Every page and document uses the theme's layout; the home page sets its own.
defaults:
  - scope:
      path: ""
    values:
      layout: default
